services:
  backend:
    build:
      context: ./backend
    environment:
      SQLITE_PATH: /data/dynamiq.sqlite3
    restart: unless-stopped
    volumes:
      - app_data:/data
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/health', timeout=8).read()"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:?Set BASIC_AUTH_USER in the repository .env file}
      BASIC_AUTH_PASSWORD: ${BASIC_AUTH_PASSWORD:?Set BASIC_AUTH_PASSWORD in the repository .env file}
      BACKEND_URL: backend:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:10000"

volumes:
  app_data:
